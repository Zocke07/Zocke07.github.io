# tools/check.py asserts what is otherwise true only by care, so a page cannot
# be added from a half-remembered template and quietly diverge. It documents
# what it checks; this file only runs it.
#
# There is no build. GitHub Pages deploys the branch as it stands, so nothing
# here produces the site.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies to install: check.py is standard library only.
      - name: Run site checks
        run: python3 tools/check.py

      # check.py reads main.js for the class names it uses, not for whether it
      # still runs, and a stray brace there takes out every behaviour at once.
      # ubuntu-latest has node, and --check only parses, so no build appears.
      - name: Parse main.js
        run: node --check assets/js/main.js
